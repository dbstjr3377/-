<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:DdLabel;src:url(fonts/label-ko.ttf);unicode-range:U+AC00-D7A3,U+3131-318E}
@font-face{font-family:DdLabel;src:url(fonts/label-latin.ttf)}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:absolute;top:0}
</style></head>
<body><div id="stage"></div>
<script src="ruffle/ruffle.js"></script>
<script>
// 서버(마인크래프트 플러그인)가 헤드리스 크로미움으로 여는 페이지.
// Ruffle 로 원본 SWF 를 그대로 실행하고, 화면을 지도 색상으로 바꿔 바뀐 부분만 서버에 넘긴다.
const Q = new URLSearchParams(location.search);
const W = +Q.get('w'), H = +Q.get('h');          // 지도 벽 픽셀 크기 (128 의 배수)
const SX = +Q.get('sx'), SW = +Q.get('sw');       // 스테이지가 그려지는 x, 폭 (세로는 H 전체)
const STAGE_W = 550, STAGE_H = 413, SCALE = H / STAGE_H;
const TILE = 128, COLS = W / TILE, ROWS = H / TILE;

window.dd = {phase: 'intro', drag: 0, label: '', vote: '', loaded: false, err: null};
window.ddPhase = p => { dd.phase = p; };
window.ddDrag = () => { dd.drag++; };

window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false, contextMenu: 'off', letterbox: 'off',
  preferredRenderer: 'canvas', quality: 'high', backgroundColor: '#000000', logLevel: 'error',
  allowScriptAccess: true, openUrlMode: 'allow', warnOnUnsupportedContent: false, showSwfDownload: false,
  autoplayPolicy: 'allowed',
};
const host = document.getElementById('stage');
host.style.left = SX + 'px'; host.style.width = SW + 'px'; host.style.height = H + 'px';
const player = window.RufflePlayer.newest().createPlayer();
player.style.width = SW + 'px'; player.style.height = H + 'px'; player.style.display = 'block';
host.appendChild(player);
player.ruffle().load({url: Q.get('swf'), allowScriptAccess: true})
  .then(() => { dd.loaded = true; }).catch(e => { dd.err = String(e); });

// ---- 지도 색상 변환 ----
let LUT = null, PAL = null;
window.ddPalette = b64 => {        // 서버가 보내는 지도 팔레트: 인덱스 i 의 RGB (i*3), 0 = 투명(미사용)
  const bin = atob(b64); PAL = [];
  for (let i = 0; i < bin.length / 3; i++) PAL.push([bin.charCodeAt(i*3), bin.charCodeAt(i*3+1), bin.charCodeAt(i*3+2)]);
  LUT = new Uint8Array(32768);
  for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
    const R = r * 8 + 4, G = g * 8 + 4, B = b * 8 + 4;
    let best = 0, bd = 1e18;
    for (let i = 4; i < PAL.length; i++) {
      const p = PAL[i]; if (!p) continue;
      const rm = (R + p[0]) / 2, dr = R - p[0], dg = G - p[1], db = B - p[2];
      const dist = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;
      if (dist < bd) { bd = dist; best = i; }
    }
    LUT[(r << 10) | (g << 5) | b] = best;
  }
  return true;
};

const comp = document.createElement('canvas'); comp.width = W; comp.height = H;
const cx = comp.getContext('2d', {willReadFrequently: true});
let prev = null, ruffleCanvas = null;

function findCanvas() {
  if (ruffleCanvas && ruffleCanvas.isConnected) return ruffleCanvas;
  const root = player.shadowRoot || player;
  ruffleCanvas = root.querySelector('canvas');
  return ruffleCanvas;
}

function drawOverlay() {
  cx.textBaseline = 'top';
  const fs = Math.round(15 * SCALE);
  cx.font = 'bold ' + fs + 'px DdLabel, sans-serif';
  const lx = SX + 9 * SCALE, ly = 250 * SCALE;    // 원본 좌측 상단 UI 아래
  if (dd.label) {
    cx.lineWidth = Math.max(3, fs / 5); cx.strokeStyle = '#000'; cx.fillStyle = '#ffffff';
    cx.strokeText(dd.label, lx, ly); cx.fillText(dd.label, lx, ly);
  }
  if (dd.vote && dd.phase === 'demo') {
    const vx = SX + 479 * SCALE, vy = 318 * SCALE;
    cx.textAlign = 'center';
    cx.lineWidth = Math.max(3, fs / 5); cx.strokeStyle = '#000'; cx.fillStyle = '#ffe14d';
    cx.strokeText(dd.vote, vx, vy); cx.fillText(dd.vote, vx, vy);
    cx.textAlign = 'left';
  }
}

// 바뀐 지도 조각만 바이너리로: [타일, x, y, w-1, h-1, 픽셀...]*
window.ddGrab = full => {
  const c = findCanvas();
  if (!LUT || !c) return null;
  cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
  try { cx.drawImage(c, SX, 0, SW, H); } catch (e) { return null; }
  drawOverlay();
  const px = cx.getImageData(0, 0, W, H).data;
  const cur = new Uint8Array(W * H);
  for (let i = 0, j = 0; i < cur.length; i++, j += 4)
    cur[i] = LUT[((px[j] >> 3) << 10) | ((px[j+1] >> 3) << 5) | (px[j+2] >> 3)];
  const parts = [];
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    let x0 = TILE, y0 = TILE, x1 = -1, y1 = -1;
    for (let y = 0; y < TILE; y++) {
      const row = (ty * TILE + y) * W + tx * TILE;
      for (let x = 0; x < TILE; x++) {
        const k = row + x;
        if (full || !prev || prev[k] !== cur[k]) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (x1 < 0) continue;
    const w = x1 - x0 + 1, h = y1 - y0 + 1;
    const out = new Uint8Array(5 + w * h);
    out[0] = ty * COLS + tx; out[1] = x0; out[2] = y0; out[3] = w - 1; out[4] = h - 1;
    for (let y = 0; y < h; y++) {
      const row = (ty * TILE + y0 + y) * W + tx * TILE + x0;
      out.set(cur.subarray(row, row + w), 5 + y * w);
    }
    parts.push(out);
  }
  prev = cur;
  let s = '';
  for (const p of parts) for (let i = 0; i < p.length; i += 0x8000) s += String.fromCharCode.apply(null, p.subarray(i, i + 0x8000));
  return {d: btoa(s), p: dd.phase, g: dd.drag, ok: dd.loaded, e: dd.err};
};
</script></body></html>
