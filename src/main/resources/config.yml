# 띵호와 주방장1 - 마인크래프트 설정

screen:
  # 화면 세로 크기를 클라이언트 화면(세로 시야)에 꼭 맞춤. 조작자 눈높이에 화면 중심, 거리 자동 계산
  fit-to-view: true
  # 클라이언트 시야각(FOV). 마인크래프트 기본값 70 ("Normal")
  fov: 70
  # 게임 화면 가로 길이(블록). 세로는 원본 비율(550x413). fit-to-view 일 때 화면이 땅에 묻히지 않도록 최대 약 4.18
  width: 4.0
  # fit-to-view: false 일 때만 사용 — 조작자 눈에서 화면까지 거리(블록), 높이 보정
  distance: 5.5
  height-offset: 0.0
  # 다른 플레이어에게 화면이 보이는 거리 배율(1.0 = 64블록)
  view-range: 1.5

control:
  # 조작자를 시작 위치에 고정(시선만 움직임). fit-to-view 일 때는 고정해야 화면이 시야에 꼭 맞습니다
  lock-controller: true

resource-pack:
  # 접속 시 리소스팩 자동 전송
  enabled: true
  # 내장 HTTP 서버 포트 (서버 방화벽/포트포워딩에서 열어주세요)
  port: 8163
  # 직접 호스팅할 경우 전체 URL 입력 (비워두면 내장 서버 사용, 주소는 플레이어가 접속한 호스트명)
  public-url: ""
  # true 면 리소스팩 거절 시 접속 불가
  required: false
  prompt: "띵호와 주방장 게임 리소스팩을 받아주세요!"

sound:
  enabled: true
  volume: 1.5

render:
  # 화면 밝기 보정용 모델 기울기 방향 (리소스팩과 맞춰져 있으므로 보통 수정할 필요 없음)
  tilt-sign: 1

debug:
  # 효과음 재생 시각을 서버 로그에 기록 (동영상 녹화용)
  log-sounds: false
