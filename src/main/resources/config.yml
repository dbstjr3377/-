# 띵호와 주방장 1·2 - 마인크래프트 설정

ui:
  # true: 접속한 모든 플레이어 화면에 게임이 뜸 (시연 중 '바로시작!' 투표 가능)
  # false: 조작자만 화면이 뜸 (다른 사람은 /ddinghowa watch 로 켜기)
  everyone: true
  # 고개를 위아래로 이만큼(도) 돌리면 커서가 화면 위 끝→아래 끝으로 이동 (가로는 화면 비율만큼)
  cursor-fov: 70

resource-pack:
  # 접속 시 리소스팩 자동 전송 (게임 화면/셰이더/효과음이 들어 있으므로 필수)
  enabled: true
  # 내장 HTTP 서버 포트 (서버 방화벽/포트포워딩에서 열어주세요)
  port: 8163
  # 직접 호스팅할 경우 전체 URL 입력 (비워두면 내장 서버 사용, 주소는 플레이어가 접속한 호스트명)
  public-url: ""
  # true 면 리소스팩 거절 시 접속 불가
  required: false
  prompt: "띵호와 주방장 게임 리소스팩을 받아주세요!"

sound:
  enabled: true
  volume: 1.0

debug:
  # 효과음 재생 시각을 서버 로그에 기록 (동영상 녹화용)
  log-sounds: false
